<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daniel Storme</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
        }

        /* =========================
           PAGE DE CONNEXION
        ========================== */

        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #050505, #151515, #252525);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            color: white;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 38px;
            letter-spacing: 2px;
        }

        .logo p {
            color: #aaa;
            margin-top: 8px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #444;
            outline: none;
            background: #111;
            color: white;
            font-size: 16px;
        }

        .input-group input:focus {
            border-color: #fff;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: scale(1.02);
            background: #ddd;
        }

        .error {
            color: #ff6b6b;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        /* =========================
           DEUXIÈME PAGE
        ========================== */

        .prank-page {
            min-height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            text-align: center;

            background:
                linear-gradient(
                    rgba(0,0,0,0.45),
                    rgba(0,0,0,0.55)
                ),
                url("https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?auto=format&fit=crop&w=2000&q=80");

            background-size: cover;
            background-position: center;
        }

        .message {
            color: white;
            padding: 40px;
            background: rgba(0,0,0,0.45);
            border-radius: 25px;
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .message h2 {
            font-size: clamp(35px, 8vw, 75px);
            margin-bottom: 15px;
        }

        .message p {
            font-size: clamp(20px, 4vw, 30px);
        }

        .laugh {
            font-size: 55px;
            margin-top: 15px;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 500px) {

            .login-box {
                padding: 30px 20px;
            }

            .logo h1 {
                font-size: 30px;
            }

            .message {
                margin: 20px;
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         PAGE 1 : CONNEXION DEMO
    ========================== -->

    <section class="login-page" id="loginPage">

        <div class="login-box">

            <div class="logo">
                <h1>Daniel Storme</h1>
                <p>Connexion</p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Adresse e-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="exemple@email.com"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="code">Code</label>

                    <input
                        type="password"
                        id="code"
                        placeholder="Entrez un code"
                        autocomplete="off"
                        required
                    >
                </div>

                <button class="login-btn" type="submit">
                    Se connecter
                </button>

                <div class="error" id="error">
                    Veuillez remplir correctement les champs.
                </div>

            </form>

        </div>

    </section>


    <!-- =========================
         PAGE 2 : BLAGUE
    ========================== -->

    <section class="prank-page" id="prankPage">

        <div class="message">

            <h2>
                Je t’ai fait perdre ton temps 😂
            </h2>

            <p>
                Bienvenue sur Daniel Storme !
            </p>

            <div class="laugh">
                🐒😂
            </div>

        </div>

    </section>


    <script>

        const loginForm = document.getElementById("loginForm");

        const loginPage = document.getElementById("loginPage");

        const prankPage = document.getElementById("prankPage");

        const error = document.getElementById("error");


        loginForm.addEventListener("submit", function(event) {

            // Empêche l'envoi des données vers un serveur
            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const code =
                document.getElementById("code").value.trim();


            if (email === "" || code === "") {

                error.style.display = "block";

                return;
            }


            /*
                DEMO UNIQUEMENT

                Les données ne sont :
                - ni enregistrées
                - ni envoyées à un serveur
                - ni transmises à quelqu'un
            */


            loginPage.style.display = "none";

            prankPage.style.display = "flex";

        });

    </script>

</body>
</html>
